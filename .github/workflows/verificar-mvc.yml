name: Verificar MVC y requisitos funcionales
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      Persistencia__Usuarios: Memoria
      Persistencia__Clientes: Memoria
      Persistencia__Proveedores: Memoria
      Persistencia__Productos: Memoria
      Persistencia__Compras: Memoria
      Persistencia__Ventas: Memoria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar vistas y código C#
        run: dotnet build Tienda_Giovanna.csproj
      - name: Comprobar los RF en C#
        run: dotnet run --project tests/RfChecks/RfChecks.csproj
      - name: Revisar sintaxis de JavaScript
        run: |
          node --check wwwroot/js/site.js
          node --check wwwroot/js/gestion.js
      - name: Preparar Chromium para probar productos
        run: |
          npm install --prefix /tmp/giovanna-ui --no-save playwright@1.62.1
          /tmp/giovanna-ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Comprobar operaciones HTTP y gestión de productos en pantalla
        env:
          ASPNETCORE_ENVIRONMENT: Development
          NODE_PATH: /tmp/giovanna-ui/node_modules
        run: |
          dotnet run --no-build --no-launch-profile --project Tienda_Giovanna.csproj --urls http://127.0.0.1:5099 > /tmp/giovanna.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          python3 tests/http_checks.py
          node tests/browser_products.cjs
          node tests/browser_modules.cjs
      - name: Guardar reportes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-qa
          path: /tmp/giovanna-qa
